name: Build Flutter APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git branch -r --contains HEAD | grep -q 'origin/main'; then
            echo "❌ This tag is not on the main branch. Skipping build."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/swapapp-release.jks

      - name: Create local.properties
        run: |
          echo "STORE_FILE=swapapp-release.jks" > android/local.properties
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/swapapp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swapapp-apk
          path: app/build/app/outputs/flutter-apk/swapapp.apk

      - name: Delete existing release if exists
        run: gh release delete ${{ github.ref_name }} --yes --cleanup-tag=false || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/build/app/outputs/flutter-apk/swapapp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
